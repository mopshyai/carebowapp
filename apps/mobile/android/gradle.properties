# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# The RN 0.87 / AGP 9 toolchain is materially heavier than the old baseline.
# Keep CareBow's larger CI/local heap rather than dropping to the template default.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK.
android.useAndroidX=true
# Keep Jetifier during the first RN 0.87 compatibility pass because CareBow still
# has older native libraries. Remove it only after the native dependency audit
# proves nothing consumes legacy support libraries.
android.enableJetifier=true

# Use this property to specify which architecture you want to build.
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# React Native 0.87 is New-Architecture-only in CareBow's supported migration path.
newArchEnabled=true

# Use Hermes for the production JS engine.
hermesEnabled=true

# Match the RN 0.87 template behavior. Real-device UI validation remains required
# before release because targetSdk 36 changes system-bar behavior.
edgeToEdgeEnabled=true

# RN 0.87 ships with AGP 9. Keep the compatibility opt-outs recommended by the
# upstream template for AGP 9's built-in Kotlin and new DSL behavior.
android.builtInKotlin=false
android.newDsl=false

# Release signing is NOT configured here. Credentials live in
# keystore.properties (gitignored, local only) or are injected by CI/Fastlane.
