apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

// Vector icons configuration
apply from: file("../../../../node_modules/react-native-vector-icons/fonts.gradle")

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    // CareBow is a workspace app, so its package root and hoisted native packages
    // live above the default standalone-template locations.
    root = file("../../")
    reactNativeDir = file("../../../../node_modules/react-native")
    codegenDir = file("../../../../node_modules/@react-native/codegen")
    cliFile = file("../../../../node_modules/react-native/cli.js")

    /* Hermes Commands */
    // Resolve Hermes from the hoisted RN package. file() makes the path absolute,
    // avoiding dependence on the shell working directory in CI/Fastlane.
    hermesCommand = file("../../../../node_modules/react-native/sdks/hermesc/%OS-BIN%/hermesc").absolutePath

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * RN 0.87's supported JSC artifact. Hermes remains enabled for CareBow, but keep
 * the fallback dependency valid so toggling the engine does not resurrect the
 * removed legacy org.webkit artifact.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.carebow"
    defaultConfig {
        applicationId "com.carebow"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            // Credentials come from keystore.properties (gitignored) for local
            // release builds, or from the environment. Never from a tracked
            // file — the previous keystore and its password were both committed
            // to this public repo and had to be treated as compromised.
            //
            // CI does not use this block at all: fastlane injects signing via
            // android.injected.signing.* so no secret is ever written to disk
            // in a tracked location.
            def props = new Properties()
            def propsFile = rootProject.file('keystore.properties')
            if (propsFile.exists()) {
                propsFile.withInputStream { props.load(it) }
            }

            def storeFileName = props['CAREBOW_RELEASE_STORE_FILE'] ?: System.getenv('ANDROID_KEYSTORE_PATH')
            def storePw = props['CAREBOW_RELEASE_STORE_PASSWORD'] ?: System.getenv('ANDROID_KEYSTORE_PASSWORD')
            def alias = props['CAREBOW_RELEASE_KEY_ALIAS'] ?: System.getenv('ANDROID_KEY_ALIAS')
            def keyPw = props['CAREBOW_RELEASE_KEY_PASSWORD'] ?: System.getenv('ANDROID_KEY_PASSWORD')

            if (storeFileName && storePw && alias && keyPw) {
                storeFile file(storeFileName)
                storePassword storePw
                keyAlias alias
                keyPassword keyPw
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

// react-native-vector-icons' fonts.gradle copies fonts into
// build/intermediates/ReactNativeVectorIcons and adds that directory to
// assets.srcDirs, but does not declare the generated directory to lint model
// tasks. Preserve the ordering rule until vector-icons is migrated off its
// legacy fonts.gradle integration.
tasks.matching {
    it.name.startsWith('lintVital') || it.name.contains('LintVitalReportModel')
}.configureEach {
    dependsOn 'copyReactNativeVectorIconFonts'
}
