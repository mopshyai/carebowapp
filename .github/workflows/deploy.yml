name: Release Mobile

# Publish only after the CI workflow has completed successfully on main.
# Manual workflow_dispatch remains available for an intentional re-release of
# a main commit that has already passed CI.
#
# Release secrets may live at repository level today and should move into the
# `testflight` / `play-internal` GitHub Environments as the team grows. Never put
# server-side credentials into MOBILE_DOTENV: mobile bundle values are public.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: release-mobile
  cancel-in-progress: false

env:
  NODE_VERSION: "22.22.0"
  PNPM_VERSION: "10.20.0"
  RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

jobs:
  gate:
    name: Release gate
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release: ${{ steps.changes.outputs.release }}
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 2

      - name: Verify manual release has passed CI
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Manual mobile releases are restricted to the main branch."
            exit 1
          fi

          successful_ci_runs="$(
            gh api \
              "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${RELEASE_SHA}&event=push&per_page=100" \
              --jq '[.workflow_runs[] | select(.name == "CI" and .head_branch == "main" and .conclusion == "success")] | length'
          )"

          if [ "$successful_ci_runs" -lt 1 ]; then
            echo "::error::Release SHA ${RELEASE_SHA} has no successful CI push run on main."
            exit 1
          fi

      - id: changes
        name: Decide whether this commit affects a mobile release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Workflow/governance-only changes must not silently publish a new app.
          # Release pipeline changes are exercised via workflow_dispatch.
          if git diff --quiet HEAD^ HEAD -- \
            apps/mobile \
            packages \
            package.json \
            pnpm-lock.yaml; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  ios:
    name: TestFlight
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: macos-14
    timeout-minutes: 60
    environment: testflight
    steps:
      - name: Check required iOS release configuration
        shell: bash
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_B64: ${{ secrets.APP_STORE_CONNECT_KEY_B64 }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          MOBILE_DOTENV: ${{ secrets.MOBILE_DOTENV }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$APP_STORE_CONNECT_KEY_ID" ] || missing+=(APP_STORE_CONNECT_KEY_ID)
          [ -n "$APP_STORE_CONNECT_ISSUER_ID" ] || missing+=(APP_STORE_CONNECT_ISSUER_ID)
          [ -n "$APP_STORE_CONNECT_KEY_B64" ] || missing+=(APP_STORE_CONNECT_KEY_B64)
          [ -n "$MATCH_GIT_URL" ] || missing+=(MATCH_GIT_URL)
          [ -n "$MATCH_PASSWORD" ] || missing+=(MATCH_PASSWORD)
          [ -n "$MATCH_GIT_BASIC_AUTHORIZATION" ] || missing+=(MATCH_GIT_BASIC_AUTHORIZATION)
          [ -n "$KEYCHAIN_PASSWORD" ] || missing+=(KEYCHAIN_PASSWORD)
          [ -n "$MOBILE_DOTENV" ] || missing+=(MOBILE_DOTENV)
          if [ ${#missing[@]} -ne 0 ]; then
            printf '::error::Missing required iOS release configuration: %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Checkout validated commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: apps/mobile

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Materialise production mobile config
        working-directory: apps/mobile
        shell: bash
        env:
          MOBILE_DOTENV: ${{ secrets.MOBILE_DOTENV }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$MOBILE_DOTENV" > .env

      - name: Build and upload to TestFlight
        working-directory: apps/mobile
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_B64: ${{ secrets.APP_STORE_CONNECT_KEY_B64 }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          BUILD_NUMBER: ${{ github.run_number }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
        run: bundle exec fastlane ios beta

      - name: Remove materialised mobile config
        if: always()
        working-directory: apps/mobile
        run: rm -f .env

  android:
    name: Play internal
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: play-internal
    steps:
      - name: Check required Android release configuration
        shell: bash
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          MOBILE_DOTENV: ${{ secrets.MOBILE_DOTENV }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ] || missing+=(PLAY_SERVICE_ACCOUNT_JSON)
          [ -n "$ANDROID_KEYSTORE_B64" ] || missing+=(ANDROID_KEYSTORE_B64)
          [ -n "$ANDROID_KEYSTORE_PASSWORD" ] || missing+=(ANDROID_KEYSTORE_PASSWORD)
          [ -n "$ANDROID_KEY_ALIAS" ] || missing+=(ANDROID_KEY_ALIAS)
          [ -n "$ANDROID_KEY_PASSWORD" ] || missing+=(ANDROID_KEY_PASSWORD)
          [ -n "$MOBILE_DOTENV" ] || missing+=(MOBILE_DOTENV)
          if [ ${#missing[@]} -ne 0 ]; then
            printf '::error::Missing required Android release configuration: %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Checkout validated commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: apps/mobile

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Materialise production mobile config
        working-directory: apps/mobile
        shell: bash
        env:
          MOBILE_DOTENV: ${{ secrets.MOBILE_DOTENV }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$MOBILE_DOTENV" > .env

      - name: Decode upload keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"

      - name: Build and upload to Play internal
        working-directory: apps/mobile
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          BUILD_NUMBER: ${{ github.run_number }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
        run: bundle exec fastlane android beta

      - name: Remove release material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/upload.keystore"
          rm -f apps/mobile/.env
