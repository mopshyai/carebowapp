name: RN 0.87 strict API fixes

on:
  push:
    branches: [codex/rn087-react19-migration]
    paths:
      - ".github/workflows/rn87-strict-api-fixes.yml"

permissions:
  contents: write

jobs:
  codemod:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: codex/rn087-react19-migration
          persist-credentials: true

      - name: Apply count-checked RN 0.87 public API fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path('apps/mobile/src')
          files = list(root.rglob('*.ts')) + list(root.rglob('*.tsx'))

          status_count = 0
          fill_count = 0
          for path in files:
              text = path.read_text()
              original = text

              text, n = re.subn(
                  r'(<StatusBar[^>\n]*?)\s+backgroundColor=\{[^}\n]+\}(\s*/>)',
                  r'\1\2',
                  text,
              )
              status_count += n

              replacement = (
                  "position: 'absolute',\n"
                  "    top: 0,\n"
                  "    right: 0,\n"
                  "    bottom: 0,\n"
                  "    left: 0,"
              )
              text, n = re.subn(r'\.\.\.StyleSheet\.absoluteFillObject,', replacement, text)
              fill_count += n

              if text != original:
                  path.write_text(text)

          # The failing RN 0.87 typecheck showed 3 StatusBar background props and
          # 6 absoluteFillObject uses. SplashScreen was already fixed manually,
          # so this one-off codemod must find exactly 2 and 4 respectively.
          if status_count != 2:
              raise SystemExit(f'Expected 2 remaining StatusBar fixes, found {status_count}')
          if fill_count != 4:
              raise SystemExit(f'Expected 4 remaining absoluteFillObject fixes, found {fill_count}')

          print(f'Applied {status_count} StatusBar and {fill_count} absolute-fill fixes')
          PY

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/src
          git diff --cached --check
          git commit -m "fix: migrate RN 0.87 strict public APIs"
          git push origin HEAD:codex/rn087-react19-migration
