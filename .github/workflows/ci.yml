name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "10"

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test -- --passWithNoTests --ci

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # NOTE: there is no generic `build` job. `pnpm build` executed zero tasks —
  # no remaining workspace defines a build script, and the job carried
  # DATABASE_URL / AUTH_SECRET left over from the deleted apps/api. A green
  # check for running nothing is worse than no check. The real builds are
  # build-ios and build-android below.

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security audit
        # Advisory only: a transitive CVE with no available fix should surface,
        # not block every merge. Review the output, do not ignore it.
        run: pnpm audit --audit-level=high
        continue-on-error: true

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install CocoaPods
        run: |
          cd apps/mobile/ios
          pod install

      - name: Build iOS
        # generic/platform, not a named device. Pinning "iPhone 16" ties the
        # build to whatever simulators a given runner image happens to ship
        # with, and fails with "Unable to find a device matching the provided
        # destination specifier" the moment that changes. We are compiling, not
        # running, so no concrete device is needed.
        run: |
          cd apps/mobile
          xcodebuild -workspace ios/CareBow.xcworkspace \
            -scheme CareBow \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            build

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # signingConfigs.release (apps/mobile/android/app/build.gradle) needs a
      # keystore or it fails packaging with "SigningConfig is missing required
      # property storeFile" — this job only verifies the release variant still
      # compiles and packages, so a disposable key is enough. It is never the
      # real upload key: that lives in the ANDROID_KEYSTORE_B64 secret used by
      # deploy.yml's publish job, gitignored locally, and untouched here.
      - name: Generate ephemeral release-signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/ci-release.keystore" \
            -alias ci-release \
            -keyalg RSA -keysize 2048 -validity 1 \
            -storepass ci-release-only \
            -keypass ci-release-only \
            -dname "CN=CI, OU=CI, O=CareBow, L=CI, ST=CI, C=US"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/ci-release.keystore" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=ci-release-only" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=ci-release" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=ci-release-only" >> "$GITHUB_ENV"

      - name: Build Android
        run: |
          cd apps/mobile/android
          ./gradlew assembleRelease
